[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchlab"
version = "0.14.0"
description = "Spin up disposable SolrCloud clusters, generate synthetic data, and run open-loop load tests. For learning Solr and reproducing performance issues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
recall = ["numpy>=1.24"]

[project.scripts]
searchlab = "searchlab.cli:main"

[tool.setuptools.packages.find]
include = ["searchlab*"]

[tool.setuptools.package-data]
searchlab = ["templates/*.j2", "templates/*.html", "lessons/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
